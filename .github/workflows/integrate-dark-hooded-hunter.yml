name: Integrate Dark Hooded Hunter iOS

on:
  workflow_dispatch:
  push:
    branches:
      - v3-development
    paths:
      - '.github/workflows/integrate-dark-hooded-hunter.yml'

permissions:
  contents: write
  actions: write

jobs:
  integrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout v3-development
        uses: actions/checkout@v4
        with:
          ref: v3-development

      - name: Integrate hunter sprite animations
        shell: bash
        env:
          HUNTER_ASSETS_B64: ''
          HUNTER_BUILD_BLOCK_B64: ''
          HUNTER_SPRITE_CALL_B64: 'ICAgICAgICBhbmltYXRlSHVudGVyU3ByaXRlKAogICAgICAgICAgICByZXNvbHV0aW9uCiAgICAgICAgKQoK'
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import base64
          import os

          combat_path = Path("Sources/V3/CombatScene.swift")
          assets_path = Path("Sources/V3/HunterSpriteAssets.swift")

          combat = combat_path.read_text(encoding="utf-8")

          property_line = "    private var hunterSpriteNode: SKSpriteNode?\n"
          sword_line = "    private var hunterSwordNode: SKShapeNode?\n"

          if property_line not in combat:
              if sword_line not in combat:
                  raise SystemExit("Could not find hunterSwordNode property")
              combat = combat.replace(
                  sword_line,
                  sword_line + property_line,
                  1,
              )

          new_build_block = base64.b64decode(
              os.environ["HUNTER_BUILD_BLOCK_B64"]
          ).decode("utf-8")

          build_start = combat.find("    private func buildHunter() {")
          placeholder_start = combat.find(
              "    private func buildHunterPlaceholder() {",
              build_start,
          )

          if build_start < 0 or placeholder_start < 0:
              raise SystemExit("Could not locate buildHunter block")

          combat = (
              combat[:build_start]
              + new_build_block
              + combat[placeholder_start:]
          )

          sprite_call = base64.b64decode(
              os.environ["HUNTER_SPRITE_CALL_B64"]
          ).decode("utf-8")

          attack_function = combat.find(
              "    private func animateHunterAttack("
          )
          sword_call = '''        animateSword(
              resolution
          )'''

          if sprite_call not in combat:
              sword_pos = combat.find(
                  sword_call,
                  attack_function,
              )
              if sword_pos < 0:
                  raise SystemExit("Could not locate animateSword call")
              combat = (
                  combat[:sword_pos]
                  + sprite_call
                  + combat[sword_pos:]
              )

          combat_path.write_text(
              combat,
              encoding="utf-8",
          )

          assets = base64.b64decode(
              os.environ["HUNTER_ASSETS_B64"]
          ).decode("utf-8")

          assets_path.write_text(
              assets,
              encoding="utf-8",
          )

          print("Hunter integration prepared.")
          print("CombatScene.swift:", combat_path.stat().st_size, "bytes")
          print("HunterSpriteAssets.swift:", assets_path.stat().st_size, "bytes")
          PY

      - name: Verify integration
        shell: bash
        run: |
          test -f Sources/V3/HunterSpriteAssets.swift
          grep -q "hunterSpriteNode" Sources/V3/CombatScene.swift
          grep -q "animateHunterSprite" Sources/V3/CombatScene.swift
          grep -q "HunterSpriteAssets" Sources/V3/CombatScene.swift
          grep -q "static let idleFrames" Sources/V3/HunterSpriteAssets.swift

      - name: Commit integrated hunter
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add             Sources/V3/CombatScene.swift             Sources/V3/HunterSpriteAssets.swift

          if git diff --cached --quiet; then
            echo "Hunter is already integrated."
          else
            git commit -m "Integrate Dark Hooded Hunter animations"
            git push origin HEAD:v3-development
          fi

      - name: Trigger V3 IPA build
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          gh workflow run build-ipa.yml --ref v3-development
