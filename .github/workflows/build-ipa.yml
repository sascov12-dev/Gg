name: Build The Last Hunter V3 IPA

on:
  workflow_dispatch:

  push:
    branches:
      - v3-development

    paths:
      - 'Sources/V3/**'
      - 'Info.plist'
      - '.github/workflows/build-ipa.yml'

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 20

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare build folders
        shell: bash
        run: |
          set -euo pipefail

          rm -rf build

          mkdir -p build/resources
          mkdir -p build/icons/Assets.xcassets/AppIcon.appiconset

      - name: Generate V3 audio resources
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import math
          import random
          import re
          import struct
          import wave
          from pathlib import Path

          source = Path(
              "Sources/V3/AudioManager.swift"
          ).read_text(
              encoding="utf-8"
          )

          names = sorted(
              set(
                  re.findall(
                      r'case\s+\w+\s*=\s*"([^"]+)"',
                      source
                  )
              )
          )

          required = {
              "music_forest",
              "music_boss_layer",
              "amb_forest_wind",
              "amb_branches",
              "amb_leaves",
              "amb_boss",
              "hunter_slash_1",
              "skeleton_spawn",
              "demon_death_start",
              "coin_reward",
              "ui_tap"
          }

          missing = required.difference(
              names
          )

          if missing:
              raise RuntimeError(
                  "Missing AudioCue names: "
                  + ", ".join(
                      sorted(missing)
                  )
              )

          out = Path(
              "build/resources"
          )

          out.mkdir(
              parents=True,
              exist_ok=True
          )

          sample_rate = 22050

          def stable_seed(text):
              result = 0

              for index, char in enumerate(text):
                  result += (
                      index + 1
                  ) * ord(char)

              return result

          def write_wav(
              name,
              duration,
              base_frequency,
              ambience=False,
              music=False
          ):
              rng = random.Random(
                  stable_seed(name)
              )

              frame_count = int(
                  sample_rate
                  * duration
              )

              samples = []

              smooth_noise = 0.0

              for i in range(
                  frame_count
              ):
                  t = (
                      i
                      / sample_rate
                  )

                  if music:
                      value = (
                          0.28
                          * math.sin(
                              2
                              * math.pi
                              * base_frequency
                              * t
                          )
                          + 0.17
                          * math.sin(
                              2
                              * math.pi
                              * (
                                  base_frequency
                                  * 1.5
                              )
                              * t
                              + 0.4
                          )
                          + 0.10
                          * math.sin(
                              2
                              * math.pi
                              * (
                                  base_frequency
                                  * 2
                              )
                              * t
                              + 1.1
                          )
                      )

                      value *= (
                          0.72
                          + 0.18
                          * math.sin(
                              2
                              * math.pi
                              * t
                              / max(
                                  duration,
                                  1
                              )
                          )
                      )

                  elif ambience:
                      smooth_noise += (
                          rng.uniform(
                              -1,
                              1
                          )
                          - smooth_noise
                      ) * 0.008

                      value = (
                          0.16
                          * smooth_noise
                          + 0.08
                          * math.sin(
                              2
                              * math.pi
                              * base_frequency
                              * t
                          )
                      )

                  else:
                      envelope = math.exp(
                          -t
                          / max(
                              duration * 0.28,
                              0.03
                          )
                      )

                      value = (
                          0.52
                          * math.sin(
                              2
                              * math.pi
                              * base_frequency
                              * t
                          )
                          + 0.22
                          * math.sin(
                              2
                              * math.pi
                              * (
                                  base_frequency
                                  * 1.92
                              )
                              * t
                          )
                          + 0.08
                          * rng.uniform(
                              -1,
                              1
                          )
                      ) * envelope

                  value = max(
                      -0.92,
                      min(
                          0.92,
                          value
                      )
                  )

                  samples.append(
                      int(
                          value
                          * 32767
                      )
                  )

              path = (
                  out
                  / f"{name}.wav"
              )

              with wave.open(
                  str(path),
                  "wb"
              ) as wav:
                  wav.setnchannels(1)
                  wav.setsampwidth(2)
                  wav.setframerate(
                      sample_rate
                  )

                  wav.writeframes(
                      b"".join(
                          struct.pack(
                              "<h",
                              sample
                          )
                          for sample
                          in samples
                      )
                  )

          for index, name in enumerate(
              names
          ):
              seed = stable_seed(
                  name
              )

              if name.startswith(
                  "music_"
              ):
                  write_wav(
                      name,
                      duration=8.0,
                      base_frequency=
                          43
                          + seed % 18,
                      music=True
                  )

              elif name.startswith(
                  "amb_"
              ):
                  write_wav(
                      name,
                      duration=6.0,
                      base_frequency=
                          28
                          + seed % 24,
                      ambience=True
                  )

              else:
                  duration = (
                      0.18
                      + (
                          seed % 24
                      )
                      / 100
                  )

                  frequency = (
                      130
                      + seed % 1000
                  )

                  write_wav(
                      name,
                      duration=duration,
                      base_frequency=
                          frequency
                  )

          print(
              "Generated",
              len(names),
              "V3 audio files"
          )
          PY

          test -f build/resources/music_forest.wav
          test -f build/resources/music_boss_layer.wav
          test -f build/resources/hunter_slash_1.wav
          test -f build/resources/skeleton_spawn.wav
          test -f build/resources/demon_death_start.wav
          test -f build/resources/ui_tap.wav

      - name: Generate The Last Hunter icon
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import math
          import struct
          import zlib
          from pathlib import Path

          width = 1024
          height = 1024

          pixels = bytearray(
              width
              * height
              * 3
          )

          for y in range(height):
              for x in range(width):

                  nx = (
                      x - 512
                  ) / 512.0

                  ny = (
                      y - 512
                  ) / 512.0

                  distance = math.sqrt(
                      nx * nx
                      + ny * ny
                  )

                  glow = max(
                      0.0,
                      1.0 - distance
                  )

                  red = int(
                      7
                      + 8 * glow
                  )

                  green = int(
                      10
                      + 16 * glow
                  )

                  blue = int(
                      14
                      + 22 * glow
                  )

                  # Dark hood.
                  hood_x = (
                      x - 512
                  ) / 285.0

                  hood_y = (
                      y - 500
                  ) / 335.0

                  hood_shape = (
                      hood_x * hood_x
                      + hood_y * hood_y
                      < 1.0
                  )

                  if hood_shape:
                      red = 12
                      green = 16
                      blue = 18

                  # Face shadow.
                  face_x = (
                      x - 512
                  ) / 175.0

                  face_y = (
                      y - 520
                  ) / 180.0

                  face_shape = (
                      face_x * face_x
                      + face_y * face_y
                      < 1.0
                  )

                  if face_shape:
                      red = 2
                      green = 5
                      blue = 5

                  # Cloak shoulders.
                  if (
                      y > 640
                      and
                      abs(
                          x - 512
                      )
                      < (
                          330
                          - (
                              y - 640
                          )
                          * 0.35
                      )
                  ):
                      red = 10
                      green = 13
                      blue = 15

                  # Green eyes.
                  eye_y = (
                      500
                      <= y
                      <= 532
                  )

                  left_eye = (
                      410
                      <= x
                      <= 482
                      and eye_y
                  )

                  right_eye = (
                      542
                      <= x
                      <= 614
                      and eye_y
                  )

                  if (
                      left_eye
                      or right_eye
                  ):
                      red = 75
                      green = 235
                      blue = 112

                  index = (
                      y * width + x
                  ) * 3

                  pixels[
                      index:index + 3
                  ] = bytes(
                      (
                          red,
                          green,
                          blue
                      )
                  )

          raw = bytearray()

          for y in range(height):
              raw.append(0)

              start = (
                  y
                  * width
                  * 3
              )

              end = (
                  start
                  + width
                  * 3
              )

              raw.extend(
                  pixels[
                      start:end
                  ]
              )

          def chunk(
              chunk_type,
              data
          ):
              return (
                  struct.pack(
                      ">I",
                      len(data)
                  )
                  + chunk_type
                  + data
                  + struct.pack(
                      ">I",
                      zlib.crc32(
                          chunk_type
                          + data
                      )
                      & 0xffffffff
                  )
              )

          png = (
              b"\x89PNG\r\n\x1a\n"
              + chunk(
                  b"IHDR",
                  struct.pack(
                      ">IIBBBBB",
                      width,
                      height,
                      8,
                      2,
                      0,
                      0,
                      0
                  )
              )
              + chunk(
                  b"IDAT",
                  zlib.compress(
                      bytes(raw),
                      9
                  )
              )
              + chunk(
                  b"IEND",
                  b""
              )
          )

          icon_dir = Path(
              "build/icons/Assets.xcassets/AppIcon.appiconset"
          )

          icon_dir.mkdir(
              parents=True,
              exist_ok=True
          )

          (
              icon_dir
              / "AppIcon-1024.png"
          ).write_bytes(
              png
          )
          PY

          ICON="build/icons/Assets.xcassets/AppIcon.appiconset"

          cp "$ICON/AppIcon-1024.png" "$ICON/AppIcon-20@2x.png"
          sips -z 40 40 "$ICON/AppIcon-20@2x.png" >/dev/null

          cp "$ICON/AppIcon-1024.png" "$ICON/AppIcon-20@3x.png"
          sips -z 60 60 "$ICON/AppIcon-20@3x.png" >/dev/null

          cp "$ICON/AppIcon-1024.png" "$ICON/AppIcon-29@2x.png"
          sips -z 58 58 "$ICON/AppIcon-29@2x.png" >/dev/null

          cp "$ICON/AppIcon-1024.png" "$ICON/AppIcon-29@3x.png"
          sips -z 87 87 "$ICON/AppIcon-29@3x.png" >/dev/null

          cp "$ICON/AppIcon-1024.png" "$ICON/AppIcon-40@2x.png"
          sips -z 80 80 "$ICON/AppIcon-40@2x.png" >/dev/null

          cp "$ICON/AppIcon-1024.png" "$ICON/AppIcon-40@3x.png"
          sips -z 120 120 "$ICON/AppIcon-40@3x.png" >/dev/null

          cp "$ICON/AppIcon-1024.png" "$ICON/AppIcon-60@2x.png"
          sips -z 120 120 "$ICON/AppIcon-60@2x.png" >/dev/null

          cp "$ICON/AppIcon-1024.png" "$ICON/AppIcon-60@3x.png"
          sips -z 180 180 "$ICON/AppIcon-60@3x.png" >/dev/null

          cat > "$ICON/Contents.json" <<'JSON'
          {
            "images": [
              {
                "idiom": "iphone",
                "size": "20x20",
                "scale": "2x",
                "filename": "AppIcon-20@2x.png"
              },
              {
                "idiom": "iphone",
                "size": "20x20",
                "scale": "3x",
                "filename": "AppIcon-20@3x.png"
              },
              {
                "idiom": "iphone",
                "size": "29x29",
                "scale": "2x",
                "filename": "AppIcon-29@2x.png"
              },
              {
                "idiom": "iphone",
                "size": "29x29",
                "scale": "3x",
                "filename": "AppIcon-29@3x.png"
              },
              {
                "idiom": "iphone",
                "size": "40x40",
                "scale": "2x",
                "filename": "AppIcon-40@2x.png"
              },
              {
                "idiom": "iphone",
                "size": "40x40",
                "scale": "3x",
                "filename": "AppIcon-40@3x.png"
              },
              {
                "idiom": "iphone",
                "size": "60x60",
                "scale": "2x",
                "filename": "AppIcon-60@2x.png"
              },
              {
                "idiom": "iphone",
                "size": "60x60",
                "scale": "3x",
                "filename": "AppIcon-60@3x.png"
              },
              {
                "idiom": "ios-marketing",
                "size": "1024x1024",
                "scale": "1x",
                "filename": "AppIcon-1024.png"
              }
            ],
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

          cat > build/icons/Assets.xcassets/Contents.json <<'JSON'
          {
            "info": {
              "author": "xcode",
              "version": 1
            }
          }
          JSON

          test -f "$ICON/AppIcon-1024.png"

      - name: Compile The Last Hunter V3
        shell: bash
        run: |
          set -euo pipefail

          SDK="$(
            xcrun \
              --sdk iphoneos \
              --show-sdk-path
          )"

          APP="build/Payload/MinimalClicker.app"

          mkdir -p "$APP"

          echo "Swift files:"
          find Sources/V3 \
            -maxdepth 1 \
            -name '*.swift' \
            -print \
            | sort

          xcrun swiftc \
            -parse-as-library \
            -target arm64-apple-ios15.0 \
            -sdk "$SDK" \
            -O \
            -framework Foundation \
            -framework SwiftUI \
            -framework UIKit \
            -framework Combine \
            -framework AVFoundation \
            -framework SpriteKit \
            Sources/V3/*.swift \
            -o "$APP/MinimalClicker"

          chmod +x \
            "$APP/MinimalClicker"

          cp \
            Info.plist \
            "$APP/Info.plist"

          cp \
            build/resources/*.wav \
            "$APP/"

          test -f \
            "$APP/MinimalClicker"

          test -f \
            "$APP/music_forest.wav"

          test -f \
            "$APP/ui_tap.wav"

      - name: Compile app icon
        shell: bash
        run: |
          set -euo pipefail

          APP="build/Payload/MinimalClicker.app"

          xcrun actool \
            build/icons/Assets.xcassets \
            --compile "$APP" \
            --platform iphoneos \
            --minimum-deployment-target 15.0 \
            --target-device iphone \
            --app-icon AppIcon \
            --product-type com.apple.product-type.application \
            --output-partial-info-plist build/asset-info.plist \
            --compress-pngs

          test -f \
            "$APP/Assets.car"

      - name: Finalize Info.plist
        shell: bash
        run: |
          set -euo pipefail

          python3 <<'PY'
          import plistlib

          app_plist = (
              "build/Payload/"
              "MinimalClicker.app/"
              "Info.plist"
          )

          with open(
              app_plist,
              "rb"
          ) as file:
              info = plistlib.load(
                  file
              )

          with open(
              "build/asset-info.plist",
              "rb"
          ) as file:
              assets = plistlib.load(
                  file
              )

          info.update(
              assets
          )

          with open(
              app_plist,
              "wb"
          ) as file:
              plistlib.dump(
                  info,
                  file,
                  fmt=
                      plistlib.FMT_XML,
                  sort_keys=False
              )
          PY

          /usr/bin/plutil \
            -lint \
            build/Payload/MinimalClicker.app/Info.plist

          /usr/bin/plutil \
            -p \
            build/Payload/MinimalClicker.app/Info.plist

      - name: Package unsigned IPA
        shell: bash
        run: |
          set -euo pipefail

          cd build

          zip \
            -qry \
            TheLastHunter-V3-unsigned.ipa \
            Payload

          test -f \
            TheLastHunter-V3-unsigned.ipa

          echo "IPA size:"
          du -h \
            TheLastHunter-V3-unsigned.ipa

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: TheLastHunter-V3-unsigned-ipa
          path: build/TheLastHunter-V3-unsigned.ipa
          if-no-files-found: error
          retention-days: 30
