name: Build The Last Hunter Native Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - Unity-android
    paths:
      - TheLastHunter_Android_Native.zip
      - .github/workflows/build-unity-android.yml

permissions:
  contents: read

jobs:
  build:
    name: Build installable APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Verify Android project archive
        shell: bash
        run: |
          test -f TheLastHunter_Android_Native.zip
          unzip -t TheLastHunter_Android_Native.zip

      - name: Extract Android project
        shell: bash
        run: |
          rm -rf AndroidNative
          mkdir -p AndroidNative
          unzip -q TheLastHunter_Android_Native.zip -d AndroidNative
          test -f AndroidNative/settings.gradle.kts
          test -f AndroidNative/app/build.gradle.kts
          test -f AndroidNative/app/src/main/AndroidManifest.xml

      - name: Build debug APK
        working-directory: AndroidNative
        shell: bash
        run: |
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Prepare final APK
        shell: bash
        run: |
          APK="AndroidNative/app/build/outputs/apk/debug/app-debug.apk"
          test -f "$APK"
          test -s "$APK"
          cp "$APK" TheLastHunter.apk
          sha256sum TheLastHunter.apk
          ls -lh TheLastHunter.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: TheLastHunter-Android-APK
          path: TheLastHunter.apk
          if-no-files-found: error
          compression-level: 0
