name: Fix Hunter In Main Menu

on:
  workflow_dispatch:
  push:
    branches:
      - v3-development
    paths:
      - '.github/workflows/fix-hunter-menu.yml'

permissions:
  contents: write

jobs:
  fix-menu:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout v3-development
        uses: actions/checkout@v4
        with:
          ref: v3-development

      - name: Add animated Hunter menu sprite
        shell: bash
        run: |
          cat > Sources/V3/HunterMenuSpriteView.swift <<'SWIFT'
          import SwiftUI
          import SpriteKit

          @MainActor
          struct HunterMenuSpriteView: View {

              private let scene: HunterMenuScene

              init() {
                  let scene =
                      HunterMenuScene(
                          size:
                              CGSize(
                                  width: 180,
                                  height: 290
                              )
                      )

                  scene.scaleMode = .resizeFill
                  self.scene = scene
              }

              var body: some View {
                  SpriteView(
                      scene: scene,
                      options: [
                          .allowsTransparency,
                          .ignoresSiblingOrder,
                          .shouldCullNonVisibleNodes
                      ]
                  )
                  .background(
                      Color.clear
                  )
                  .allowsHitTesting(false)
              }
          }

          @MainActor
          private final class HunterMenuScene:
              SKScene {

              private var didBuild = false

              override func didMove(
                  to view: SKView
              ) {
                  super.didMove(
                      to: view
                  )

                  backgroundColor = .clear

                  guard !didBuild else {
                      return
                  }

                  didBuild = true
                  buildHunter()
              }

              private func buildHunter() {
                  let frames =
                      HunterSpriteAssets
                          .idleFrames

                  guard
                      let first =
                          frames.first
                  else {
                      return
                  }

                  let sprite =
                      SKSpriteNode(
                          texture: first
                      )

                  sprite.texture?
                      .filteringMode =
                      .nearest

                  sprite.size =
                      CGSize(
                          width: 180,
                          height: 180
                      )

                  sprite.position =
                      CGPoint(
                          x: size.width * 0.5,
                          y: size.height * 0.43
                      )

                  sprite.zPosition = 2

                  addChild(
                      sprite
                  )

                  if frames.count > 1 {
                      sprite.run(
                          .repeatForever(
                              .animate(
                                  with: frames,
                                  timePerFrame: 0.11,
                                  resize: false,
                                  restore: false
                              )
                          ),
                          withKey:
                              "menuHunterIdle"
                      )
                  }
              }
          }
          SWIFT

          python3 - <<'PY'
          from pathlib import Path

          path = Path("Sources/V3/MainMenuView.swift")
          text = path.read_text(encoding="utf-8")

          old = '''                HunterBackView(
                      animated:
                          hunterAnimated
                  )
          '''

          new = '''                HunterMenuSpriteView()
          '''

          if old not in text:
              raise SystemExit(
                  "Could not locate HunterBackView in MainMenuView.swift"
              )

          text = text.replace(
              old,
              new,
              1,
          )

          path.write_text(
              text,
              encoding="utf-8",
          )
          PY

      - name: Verify menu fix
        shell: bash
        run: |
          test -f Sources/V3/HunterMenuSpriteView.swift
          grep -F "HunterMenuSpriteView()" Sources/V3/MainMenuView.swift
          grep -F "HunterSpriteAssets.idleFrames" Sources/V3/HunterMenuSpriteView.swift

      - name: Commit menu fix
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add \
            Sources/V3/HunterMenuSpriteView.swift \
            Sources/V3/MainMenuView.swift

          git commit -m "Use Dark Hooded Hunter in main menu"
          git push origin HEAD:v3-development
